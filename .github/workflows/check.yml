name: Check build and deploy website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Unit checks
        run: |
          node --test tests/records.test.cjs tests/library.test.cjs tests/chess-notes.test.cjs tests/music-order.test.cjs
          python tests/piece_assets.py
      - name: Build browser application
        run: |
          python build_bundle.py
          node --check app.bundle.js
          python scripts/build_public_site.py --site-url https://827853487.github.io/chess-atelier/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: chess-atelier-website
          path: dist/
          include-hidden-files: true
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
