name: Check and package website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit checks
        run: node --test tests/records.test.cjs tests/library.test.cjs tests/chess-notes.test.cjs
      - name: Build browser application
        run: |
          python build_bundle.py
          node --check app.bundle.js
          python scripts/build_public_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: chess-atelier-website
          path: dist/
          include-hidden-files: true
